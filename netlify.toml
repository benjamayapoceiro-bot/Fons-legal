[build]
  base = "."
  command = "npm install --include=dev && npm run build --workspace @fons-legal/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "apps/web/netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"
